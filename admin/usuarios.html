<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Admin Usuarios</title>
<style>
body{font-family:Arial; margin:0; padding:0; background:#f4f4f4;}
nav{background:#1a5a8a; color:white; padding:15px; display:flex; justify-content:space-between;}
nav a{color:white; margin-right:15px; text-decoration:none; font-weight:bold;}
main{max-width:900px; margin:30px auto; background:white; padding:20px; border-radius:8px;}
table{width:100%; border-collapse:collapse; margin-top:20px;}
th,td{border:1px solid #ccc; padding:10px; text-align:left;}
th{background:#1a5a8a; color:white;}
button{padding:6px 10px; cursor:pointer; background:#c0392b; color:white; border:none; border-radius:4px;}
#formAdd{margin-top:20px; display:flex; gap:10px; flex-wrap:wrap;}
#formAdd input{padding:8px; flex:1;}
</style>
</head>
<body>
<nav>
<div><b>Gas El Volcán - ADMIN</b></div>
<div><a href="../index.html">Home</a><a href="productos.html">Productos</a><a href="usuarios.html">Usuarios</a><a href="#" onclick="salir()">Salir</a></div>
</nav>
<main>
<h1>Gestión de Usuarios</h1>
<p>Logueado como: <b id="userMail"></b></p>

<table id="tablaUsuarios">
<thead><tr><th>Correo</th><th>Rol</th><th>Acción</th></tr></thead>
<tbody></tbody>
</table>

<h3>Agregar Usuario</h3>
<form id="formAdd">
<input type="email" id="nCorreo" placeholder="correo@ejemplo.cl" required>
<input type="text" id="nPass" placeholder="contraseña" required>
<input type="text" id="nRol" placeholder="rol: cliente" value="cliente">
<button type="submit" style="background:#27ae60;">Agregar</button>
</form>
</main>

<script>
// Proteccion admin
const log = JSON.parse(localStorage.getItem('usuarioLogueado') || 'null');
if(!log || log.rol !== 'admin'){ window.location.href = '../login.html'; }
document.getElementById('userMail').innerText = log.correo;

function cargar(){
    const usuarios = JSON.parse(localStorage.getItem('usuarios') || '[]');
    const tbody = document.querySelector('#tablaUsuarios tbody');
    tbody.innerHTML = '';
    // Agrega el admin siempre visible
    const todos = [{correo:'admin@gaselvolcan.cl', rol:'admin'}, ...usuarios];
    todos.forEach((u,i)=>{
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${u.correo}</td><td>${u.rol}</td><td>${u.rol==='admin' ? '' : '<button onclick="eliminar('+ (i-1) +')">Eliminar</button>'}</td>`;
        tbody.appendChild(tr);
    });
}
function eliminar(idx){
    let usuarios = JSON.parse(localStorage.getItem('usuarios') || '[]');
    usuarios.splice(idx,1);
    localStorage.setItem('usuarios', JSON.stringify(usuarios));
    cargar();
}
document.getElementById('formAdd').addEventListener('submit', e=>{
    e.preventDefault();
    let usuarios = JSON.parse(localStorage.getItem('usuarios') || '[]');
    usuarios.push({correo: document.getElementById('nCorreo').value, password: document.getElementById('nPass').value, rol: document.getElementById('nRol').value});
    localStorage.setItem('usuarios', JSON.stringify(usuarios));
    e.target.reset();
    cargar();
});
function salir(){ localStorage.removeItem('usuarioLogueado'); window.location.href='../login.html'; }
cargar();
</script>
</body>
</html>
