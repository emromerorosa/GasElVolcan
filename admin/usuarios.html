<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Usuarios</title>
<link rel="stylesheet" href="../css/estilos.css">
</head>
<body>

<h1>Admin - Usuarios</h1>

<a href="home.html">Inicio Admin</a> |
<a href="productos.html">Productos</a> |
<a href="../index.html">Tienda</a>
<br><br>
<a href="usuario-nuevo.html"><button>Agregar Usuario</button></a>

<table border="1" style="width:95%; margin-top:20px;" cellpadding="8">
<thead>
<tr><th>RUN</th><th>Nombre</th><th>Correo</th><th>Tipo</th><th>Acciones</th></tr>
</thead>
<tbody id="cuerpoUsuarios"></tbody>
</table>

<script>
var usuariosBase = [
    {run:"11111111-1", nombre:"Admin", apellidos:"Gas El Volcan", correo:"admin@gaselvolcan.cl", pass:"admin123", tipo:"admin", rol:"admin"}
];

var usuarios = usuariosBase;
try{
    var g = localStorage.getItem("usuarios");
    if(g){
        var temp = JSON.parse(g);
        if(temp && temp.length > 0) usuarios = temp;
    } else {
        localStorage.setItem("usuarios", JSON.stringify(usuarios));
    }
}catch(e){}

function mostrar(){
    var cuerpo = document.getElementById("cuerpoUsuarios");
    cuerpo.innerHTML = "";
    for(var i=0; i < usuarios.length; i++){
        var u = usuarios[i];
        var correo = u.correo || "sin correo";
        var tipo = u.tipo || u.rol || "cliente";
        var nombre = (u.nombre || "") + " " + (u.apellidos || "");
        var run = u.run || "-";
        cuerpo.innerHTML += "<tr><td>"+run+"</td><td>"+nombre.trim()+"</td><td>"+correo+"</td><td>"+tipo+"</td><td><button onclick='editar("+i+")'>Editar</button> <button onclick='eliminar("+i+")'>Eliminar</button></td></tr>";
    }
}

function editar(i){
    localStorage.setItem("indiceUsuarioEditar", i);
    window.location.href = "usuario-editar.html";
}

function eliminar(i){
    if(usuarios[i].correo == "admin@gaselvolcan.cl"){
        alert("No se puede eliminar el admin principal");
        return;
    }
    if(confirm("¿Eliminar usuario "+usuarios[i].correo+"?")){
        usuarios.splice(i,1);
        localStorage.setItem("usuarios", JSON.stringify(usuarios));
        mostrar();
    }
}

mostrar();
</script>

</body>
</html>
