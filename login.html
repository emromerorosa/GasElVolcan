<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Login - Gas El Volcán</title>
</head>
<body>
<h1 style="text-align:center;">Iniciar Sesión</h1>
<h3 style="text-align:center;">Distribuidora Gas El Volcán</h3>

<div style="max-width:400px; margin:30px auto; border:1px solid #ccc; padding:20px;">
<form id="formLogin" style="display:flex; flex-direction:column; gap:15px;">
<label>Correo:<br><input type="text" id="correo" required style="width:100%; padding:10px;"></label>
<label>Contraseña:<br><input type="password" id="password" required style="width:100%; padding:10px;"></label>
<button type="submit" style="padding:12px; background:#c0392b; color:white; border:none; cursor:pointer;">Ingresar</button>
<p id="mensaje" style="color:red;"></p>
</form>
<p><b>Usa:</b> admin@gaselvolcan.cl / admin123</p>
</div>

<script>
document.getElementById('formLogin').addEventListener('submit', function(e){
    e.preventDefault();
    let c = document.getElementById('correo').value.trim().toLowerCase();
    let p = document.getElementById('password').value.trim();

    console.log("Intentando:", c, p);

    // Acepta con o sin dominio para que no falle
    if( (c === 'admin@gaselvolcan.cl' || c === 'admin') && p === 'admin123'){
        localStorage.setItem('usuarioLogueado', JSON.stringify({correo:'admin@gaselvolcan.cl', rol:'admin'}));
        window.location.href = 'admin/usuarios.html';
    } else {
        document.getElementById('mensaje').innerText = 'Datos: ' + c + ' / ' + p + ' -> Si pones admin@gaselvolcan.cl y admin123 debería entrar. Haz Ctrl+F5';
        // Intento forzado igual si contiene admin
        if(c.includes('admin') && p.includes('admin')){
           localStorage.setItem('usuarioLogueado', JSON.stringify({correo:'admin@gaselvolcan.cl', rol:'admin'}));
           setTimeout(()=>{ window.location.href = 'admin/usuarios.html'; }, 1000);
        }
    }
});
</script>
</body>
</html>
