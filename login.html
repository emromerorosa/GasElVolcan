<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distribuidora Gas El Volcán - Iniciar Sesión</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <header>
        <nav>
            <div class="logo">
                <span class="logo-nombre">Gas El Volcán</span>
            </div>
            <ul class="menu-principal">
                <li><a href="index.html">Home</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="blogs.html">Blogs</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
            <div class="acciones-usuario">
                <a href="carrito.html" class="carrito-link">🛒 Cart (<span id="contadorCarrito">0</span>)</a>
            </div>
        </nav>
    </header>

    
    <main class="contenedor-auth">
      <div class="auth-card">
      
        <!-- Logo y Nombre destacados (Figura 5 del mockup) -->
        <div class="auth-header">
          <div class="logo-placeholder">🔥</div>
          <h2>Gas El Volcán</h2>
          <p class="subtitulo">Ingresa a tu cuenta para gestionar tus pedidos</p>
        </div>

            <!-- Formulario de Login -->
        <form id="formLogin" novalidate>
        
            <!----> Campo: Correo Electrónico -->
          <div class="form-group">
            <label for="correo">Correo electrónico</label>
            <input 
              type="email" 
              id="correo" 
              name="correo" 
              maxlength="100" 
              placeholder="ejemplo@duoc.cl o @gmail.com"
              required
            >
            <small class="mensaje-error" id="error-correo"></small>
          </div>

         <!-- Campo: Contraseña -->
          <div class="form-group">
            <label for="password">Contraseña</label>
            <input 
              type="password" 
              id="password" 
              name="password" 
              minlength="4" 
              maxlength="10" 
              placeholder="Entre 4 y 10 caracteres"
              required
            >
            <small class="mensaje-error" id="error-password"></small>
          </div>

          <!-- Botón de envío -->
          <button type="submit" class="btn-submit">Iniciar sesión</button>

           <!-- Mensaje general de éxito/error al enviar -->
          <div id="mensaje-general" class="mensaje-alerta"></div>
        </form>

         <!-- Enlace para registrarse -->
        <div class="auth-footer">
          <p>¿No tienes una cuenta? <a href="registro.html">Regístrate aquí</a></p>
        </div>

      </div>
    </main>

    <footer>
      <p>&copy; 2026 Distribuidora Gas El Volcán</p>
    </footer>


        <!-- Script del carrito (para actualizar el contador si existe js/carrito.js) -->
    <script src="js/carrito.js"></script>
          <!-- Script con las validaciones específicas del Login -->
    <script src="js/login.js"></script>
</body>
</html>
